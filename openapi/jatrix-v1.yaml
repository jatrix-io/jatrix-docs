openapi: 3.0.3
info:
  title: Jatrix API
  description: |
    Jatrix is a SaaS Governance Engine for identity, multi-tenancy, authorization,
    and product-level control. This API manages organizations, products, tenants,
    users, roles, permissions, and entitlements.

    All responses follow `{ data, meta: { request_id, timestamp } }`. List responses
    include `meta.pagination: { limit, offset, total }`. Errors use
    `{ error: { code, message, details }, meta }`.
  version: 1.0.0
  contact:
    name: Jatrix
    email: jeffreyespinel.1992@gmail.com

servers:
  - url: https://demo.jatrix.cloud
    description: Demo API base

tags:
  - name: Health
    description: Health and readiness endpoints
  - name: Authentication
    description: Token and refresh endpoints
  - name: Organizations
    description: Organization management
  - name: Products
    description: Product management
  - name: Tenants
    description: Tenant management
  - name: Users
    description: User account management
  - name: Permissions
    description: Permission management
  - name: Roles
    description: Role management
  - name: Role Permissions
    description: Role-permission assignments
  - name: Role Assignments
    description: User role assignments
  - name: User Permission Grants
    description: Direct per-user ALLOW/DENY permission grants, independent of role assignments (ADR-0011)
  - name: Entitlements
    description: Tenant-product entitlements
  - name: Biometric
    description: Biometric enrollment and 1:1 verification (face v1, fingerprint/rfid/nfc/retina future)
  - name: Groups
    description: User groups within a tenant (organizational containers; no effect on authorization in v1)
  - name: User Profiles
    description: Extended user identity data and document management
  - name: File Storage
    description: Upload files (logos, avatars, documents) to S3 via base64. Returns CDN URL at storage.jatrix.com
  - name: Brand
    description: Public branding config resolved by tenant subdomain

security:
  - bearerAuth: []

paths:
  /health:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      description: Returns API health status. Used for load balancer probes.
      security: []
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -L 'https://demo.jatrix.cloud/health'
      responses:
        "200":
          description: API is healthy

  /ready:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: getReady
      tags: [Health]
      summary: Readiness check
      description: Returns readiness status. Verifies database connectivity.
      security: []
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -L 'https://demo.jatrix.cloud/ready'
      responses:
        "200":
          description: API is ready to serve traffic
        "503":
          description: API is not ready (e.g. database unavailable)

  /v1/auth/token:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    post:
      operationId: createToken
      tags: [Authentication]
      summary: Create token
      description: Authenticates with identifier (username or email) and password. Returns access and refresh tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenInput"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User inactive or entitlement required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/refresh:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    post:
      operationId: refreshToken
      tags: [Authentication]
      summary: Refresh token
      description: Exchanges a valid refresh token for new access and refresh tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/organizations:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: listOrganizations
      tags: [Organizations]
      summary: List organizations
      description: >-
        Lists every organization on the platform. Requires the Platform Admin
        API Key — a user JWT or Organization API Key receives 403.
      security:
        - platformAdminAuth: []
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createOrganization
      tags: [Organizations]
      summary: Create organization
      description: >-
        Creates a top-level organization. Requires the Platform Admin API Key —
        a user JWT or Organization API Key receives 403.
      security:
        - platformAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/organizations/{orgId}:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: getOrganization
      tags: [Organizations]
      summary: Get organization by ID
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateOrganization
      tags: [Organizations]
      summary: Update organization
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationInput"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteOrganization
      tags: [Organizations]
      summary: Delete organization (soft delete)
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "204":
          description: Organization deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/organizations/{orgId}/products:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: listProducts
      tags: [Products]
      summary: List products
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProduct
      tags: [Products]
      summary: Create product
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/organizations/{orgId}/products/{id}:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: getProduct
      tags: [Products]
      summary: Get product by ID
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      tags: [Products]
      summary: Update product
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductInput"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProduct
      tags: [Products]
      summary: Delete product (soft delete)
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Product deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/organizations/{orgId}/tenants:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: listTenants
      tags: [Tenants]
      summary: List tenants
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createTenant
      tags: [Tenants]
      summary: Create tenant
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantInput"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/organizations/{orgId}/tenants/{id}:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: getTenant
      tags: [Tenants]
      summary: Get tenant by ID
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTenant
      tags: [Tenants]
      summary: Update tenant
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantInput"
      responses:
        "200":
          description: Tenant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTenant
      tags: [Tenants]
      summary: Delete tenant (soft delete)
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Tenant deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/organizations/{orgId}/tenants/{id}/logo:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    patch:
      operationId: uploadTenantLogo
      tags: [File Storage]
      summary: Upload tenant logo
      description: |
        Uploads a logo image for the tenant. Accepts standard base64-encoded file.
        Returns the CDN URL (`storage.jatrix.com`). Requires `S3_BUCKET_NAME` env var to be set; returns 503 if not configured.
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileUploadInput"
            example:
              file_base64: "/9j/4AAQSkZJRgAB..."
              content_type: "image/png"
      responses:
        "200":
          description: Logo uploaded — CDN URL returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Storage not configured (S3_BUCKET_NAME missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/organizations/{orgId}/tenants/{tenantId}/users:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: listUsers
      tags: [Users]
      summary: List users
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createUser
      tags: [Users]
      summary: Create user
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/tenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/organizations/{orgId}/tenants/{tenantId}/users/by-permission:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: listUsersByPermission
      tags: [Users]
      summary: List users by effective permission
      description: >-
        Returns the tenant users who effectively hold ANY of the requested
        permission keys within the product (repeat `permission` for OR),
        considering both direct grants (effect ALLOW, not overridden by a direct
        DENY) and role-derived permissions. Paginated.
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/tenantId"
        - name: permission
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
          description: Permission key(s); repeat for OR (e.g. app.fsm.access).
        - name: product_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: List of users with the effective permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/organizations/{orgId}/tenants/{tenantId}/users/{id}:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: getUser
      tags: [Users]
      summary: Get user by ID
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      tags: [Users]
      summary: Update user
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete user (soft delete)
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: User deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/organizations/{orgId}/tenants/{tenantId}/users/{id}/activate:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    post:
      operationId: activateUser
      tags: [Users]
      summary: Activate user
      description: Transitions a user from `pending` to `active`. Only pending users can be activated.
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: User activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: User is not in pending status (INVALID_STATE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/organizations/{orgId}/tenants/{tenantId}/users/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    post:
      operationId: rejectUser
      tags: [Users]
      summary: Reject user
      description: Transitions a user from `pending` to `rejected`. Only pending users can be rejected.
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: User rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: User is not in pending status (INVALID_STATE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/organizations/{orgId}/tenants/{tenantId}/users/{id}/avatar:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    patch:
      operationId: uploadUserAvatar
      tags: [File Storage]
      summary: Upload user avatar
      description: |
        Uploads an avatar image for a user. Accepts standard base64-encoded file.
        Returns the CDN URL. Requires `S3_BUCKET_NAME` to be set; returns 503 if not configured.
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileUploadInput"
            example:
              file_base64: "/9j/4AAQSkZJRgAB..."
              content_type: "image/jpeg"
      responses:
        "200":
          description: Avatar uploaded — CDN URL returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Storage not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/organizations/{orgId}/tenants/{tenantId}/users/{userId}/profile:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: getUserProfile
      tags: [User Profiles]
      summary: Get user profile
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/tenantId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User profile (null if not yet created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: upsertUserProfile
      tags: [User Profiles]
      summary: Upsert user profile
      description: Creates or fully replaces the extended profile for a user.
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/tenantId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserProfileInput"
      responses:
        "200":
          description: Profile upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/organizations/{orgId}/tenants/{tenantId}/users/{userId}/documents:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: listUserDocuments
      tags: [User Profiles]
      summary: List user documents
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/tenantId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDocumentListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createUserDocument
      tags: [User Profiles]
      summary: Create user document (URL already known)
      description: Records a document with a pre-existing `file_url`. Use `/documents/upload` to upload a new file.
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/tenantId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserDocumentInput"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDocumentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/organizations/{orgId}/tenants/{tenantId}/users/{userId}/documents/upload:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    post:
      operationId: uploadUserDocument
      tags: [File Storage]
      summary: Upload user document
      description: |
        Uploads a document file (image or PDF) for a user. Accepts standard base64-encoded file.
        Creates the document record and returns the CDN URL. Requires `S3_BUCKET_NAME`; returns 503 if not configured.

        **Allowed content types:** `image/jpeg`, `image/png`, `image/webp`, `application/pdf`
        **Max size:** 5 MB
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/tenantId"
        - name: userId
          in: path
          required: true
