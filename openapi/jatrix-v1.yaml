openapi: 3.0.3
info:
  title: Jatrix API
  description: |
    Jatrix is a SaaS Governance Engine for identity, multi-tenancy, authorization,
    and product-level control. This API manages organizations, products, tenants,
    users, roles, permissions, and entitlements.

    All responses follow `{ data, meta: { request_id, timestamp } }`. List responses
    include `meta.pagination: { limit, offset, total }`. Errors use
    `{ error: { code, message, details }, meta }`.
  version: 1.0.0
  contact:
    name: Jatrix
    email: jeffreyespinel.1992@gmail.com

servers:
  - url: https://demo.jatrix.cloud
    description: Demo API base

tags:
  - name: Health
    description: Health and readiness endpoints
  - name: Authentication
    description: Token and refresh endpoints
  - name: Organizations
    description: Organization management
  - name: Products
    description: Product management
  - name: Tenants
    description: Tenant management
  - name: Users
    description: User account management
  - name: Permissions
    description: Permission management
  - name: Roles
    description: Role management
  - name: Role Permissions
    description: Role-permission assignments
  - name: Role Assignments
    description: User role assignments
  - name: Entitlements
    description: Tenant-product entitlements

security:
  - bearerAuth: []

paths:
  /health:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      description: Returns API health status. Used for load balancer probes.
      security: []
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -L 'https://demo.jatrix.cloud/health'
      responses:
        "200":
          description: API is healthy

  /ready:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: getReady
      tags: [Health]
      summary: Readiness check
      description: Returns readiness status. Verifies database connectivity.
      security: []
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -L 'https://demo.jatrix.cloud/ready'
      responses:
        "200":
          description: API is ready to serve traffic
        "503":
          description: API is not ready (e.g. database unavailable)

  /v1/auth/token:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    post:
      operationId: createToken
      tags: [Authentication]
      summary: Create token
      description: Authenticates with identifier (username or email) and password. Returns access and refresh tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenInput"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User inactive or entitlement required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/refresh:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    post:
      operationId: refreshToken
      tags: [Authentication]
      summary: Refresh token
      description: Exchanges a valid refresh token for new access and refresh tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

