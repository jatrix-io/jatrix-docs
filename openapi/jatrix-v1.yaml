          label: cURL
          source: |
            curl -X POST 'https://demo.jatrix.cloud/v1/biometric/enroll' \
              -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' \
              -d '{"type":"face","slot":"primary","image_base64":"<base64>","consent_at":"2026-06-13T20:00:00Z"}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiometricEnrollInput"
      responses:
        "201":
          description: Biometric enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricEnrollmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Slot already enrolled for this type (CONFLICT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Unsupported biometric type or no face detected (UNSUPPORTED_TYPE / NO_FACE_DETECTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/biometric/verify:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    post:
      operationId: verifyBiometric
      tags: [Biometric]
      summary: Verify biometric (1:1)
      description: Performs a 1:1 similarity check against an existing enrollment. Accepts Bearer JWT or Organization API Key for service-to-service calls.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X POST 'https://demo.jatrix.cloud/v1/biometric/verify' \
              -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' \
              -d '{"user_id":"<uuid>","type":"face","slot":"primary","image_base64":"<base64>"}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiometricVerifyInput"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricVerifyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No enrollment found for user/type/slot (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/biometric:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: listBiometricEnrollments
      tags: [Biometric]
      summary: List biometric enrollments
      description: Returns all active biometric enrollments for the authenticated user.
      security:
        - bearerAuth: []
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -L 'https://demo.jatrix.cloud/v1/biometric' \
              -H 'Authorization: Bearer <token>'
      responses:
        "200":
          description: List of biometric enrollments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricEnrollmentListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/biometric/{id}:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    delete:
      operationId: deleteBiometricEnrollment
      tags: [Biometric]
      summary: Delete biometric enrollment (soft delete)
      description: Removes a biometric enrollment by ID. Only the enrollment owner may delete their own enrollments.
      security:
        - bearerAuth: []
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X DELETE 'https://demo.jatrix.cloud/v1/biometric/<uuid>' \
              -H 'Authorization: Bearer <token>'
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Enrollment deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (RS256). Obtain via POST /v1/auth/token.
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Organization API Key for service-to-service calls. Looked up by SHA-256 hash.
    platformAdminAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >-
        Platform Admin API Key. Required for cross-organization operations,
        which span every organization on the platform and therefore cannot be
        scoped by the caller's own organization. Compared in constant time
        against PLATFORM_ADMIN_API_KEY. See 09-api-key-strategy.md.

  parameters:
    xRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Client-supplied request ID for correlation. Echoed in response meta.
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Organization ID
    tenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant ID
    productId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Product ID
    roleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Role ID
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
      description: Pagination limit
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
      description: Pagination offset

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not permitted (error code FORBIDDEN)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Meta:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
          description: X-Request-ID from request or generated
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp
    Pagination:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        meta:
          $ref: "#/components/schemas/Meta"

    CreateTokenInput:
      type: object
      required: [organization_id, tenant_id, product_id, identifier, password]
      properties:
        organization_id:
          type: string
          format: uuid
        organization_slug:
          type: string
        tenant_id:
          type: string
          format: uuid
        tenant_slug:
          type: string
        product_id:
          type: string
          format: uuid
        product_slug:
          type: string
        identifier:
          type: string
          description: Username or email
        password:
          type: string
          format: password
    RefreshTokenInput:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            expires_in:
              type: integer
              description: Seconds until expiry
            token_type:
              type: string
              enum: [Bearer]
        meta:
          $ref: "#/components/schemas/Meta"

    Organization:
      type: object
