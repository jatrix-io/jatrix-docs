            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createEntitlement
      tags: [Entitlements]
      summary: Create entitlement
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntitlementInput"
      responses:
        "201":
          description: Entitlement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Tenant already has entitlement to product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/organizations/{orgId}/entitlements/{id}:
    parameters:
      - $ref: "#/components/parameters/xRequestId"
    get:
      operationId: getEntitlement
      tags: [Entitlements]
      summary: Get entitlement by ID
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Entitlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEntitlement
      tags: [Entitlements]
      summary: Update entitlement
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntitlementInput"
      responses:
        "200":
          description: Entitlement updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteEntitlement
      tags: [Entitlements]
      summary: Delete entitlement (soft delete)
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Entitlement deleted
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (RS256). Obtain via POST /v1/auth/token.

  parameters:
    xRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Client-supplied request ID for correlation. Echoed in response meta.
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Organization ID
    tenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant ID
    productId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Product ID
    roleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Role ID
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
      description: Pagination limit
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
      description: Pagination offset

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Meta:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
          description: X-Request-ID from request or generated
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp
    Pagination:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        meta:
          $ref: "#/components/schemas/Meta"

    CreateTokenInput:
      type: object
      required: [organization_id, tenant_id, product_id, identifier, password]
      properties:
        organization_id:
          type: string
          format: uuid
        organization_slug:
          type: string
        tenant_id:
          type: string
          format: uuid
        tenant_slug:
          type: string
        product_id:
          type: string
          format: uuid
        product_slug:
          type: string
        identifier:
          type: string
          description: Username or email
        password:
          type: string
          format: password
    RefreshTokenInput:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            expires_in:
              type: integer
              description: Seconds until expiry
            token_type:
              type: string
              enum: [Bearer]
        meta:
          $ref: "#/components/schemas/Meta"

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
