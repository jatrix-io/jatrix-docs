      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [face, fingerprint, rfid, nfc, retina]
        slot:
          type: string
          example: primary
        provider:
          type: string
          example: aws_rekognition
        model_version:
          type: string
          example: rekognition-v1
        consent_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BiometricEnrollInput:
      type: object
      required: [type, image_base64, consent_at]
      properties:
        type:
          type: string
          enum: [face]
          description: Biometric modality. Only "face" is supported in v1.
        slot:
          type: string
          default: primary
          description: Named slot for multiple enrollments of the same type.
        image_base64:
          type: string
          description: Standard base64-encoded image.
        consent_at:
          type: string
          format: date-time
          description: RFC3339 timestamp when the user's consent was recorded client-side.

    BiometricVerifyInput:
      type: object
      required: [user_id, type, image_base64]
      properties:
        user_id:
          type: string
          format: uuid
          description: ID of the user whose enrollment to compare against.
        type:
          type: string
          enum: [face]
        slot:
          type: string
          default: primary
        image_base64:
          type: string
          description: Standard base64-encoded probe image.

    BiometricVerifyResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            verified:
              type: boolean
              description: True if similarity meets or exceeds the configured threshold.
            similarity:
              type: number
              format: float
              description: Similarity score between 0.0 and 1.0.
            enrollment_id:
              type: string
              format: uuid
              description: ID of the matched enrollment.
        meta:
          $ref: "#/components/schemas/Meta"

    BiometricEnrollmentResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/BiometricEnrollment"
        meta:
          $ref: "#/components/schemas/Meta"

